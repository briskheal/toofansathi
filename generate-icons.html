<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 35% 30%, #1e293b 0%, #0b1120 70%, #030712 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    svg {
      width: 78%;
      height: 78%;
      filter: drop-shadow(0 12px 28px rgba(14, 165, 233, 0.35));
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Radar Range Rings -->
      <circle cx="256" cy="256" r="236" stroke="#1e293b" stroke-width="10" opacity="0.8"/>
      <circle cx="256" cy="256" r="176" stroke="#0284c7" stroke-width="6" stroke-dasharray="10 10" opacity="0.5"/>
      <circle cx="256" cy="256" r="116" stroke="#38bdf8" stroke-width="5" opacity="0.4"/>
      
      <!-- Cyclone Spiral Arm 1 (Cyan to Blue) -->
      <path d="M256 90 C160 90 90 160 90 256 C90 288 98 318 114 344 C124 360 148 350 142 332 C132 310 126 284 126 256 C126 182 184 124 256 124 C328 124 386 182 386 256 C386 284 376 312 358 334 C348 346 362 364 378 354 C402 326 418 292 418 256 C418 160 348 90 256 90 Z" fill="url(#cyanGrad)"/>
      
      <!-- Cyclone Spiral Arm 2 (Warning Orange/Red) -->
      <path d="M256 422 C352 422 422 352 422 256 C422 224 414 194 398 168 C388 152 364 162 370 180 C380 202 386 228 386 256 C386 330 328 388 256 388 C184 388 126 330 126 256 C126 228 136 200 154 178 C164 166 150 148 134 158 C110 186 94 220 94 256 C94 352 164 422 256 422 Z" fill="url(#coralGrad)"/>
      
      <!-- Storm Center Eyewall -->
      <circle cx="256" cy="256" r="42" fill="#0b1120" stroke="#f59e0b" stroke-width="8"/>
      <!-- Glowing Warning Eye -->
      <circle cx="256" cy="256" r="26" fill="url(#eyeGrad)"/>
      <circle cx="256" cy="256" r="10" fill="#ffffff"/>
      
      <defs>
        <linearGradient id="cyanGrad" x1="90" y1="90" x2="418" y2="354" gradientUnits="userSpaceOnUse">
          <stop stop-color="#38bdf8"/>
          <stop offset="0.6" stop-color="#0284c7"/>
          <stop offset="1" stop-color="#0369a1"/>
        </linearGradient>
        <linearGradient id="coralGrad" x1="422" y1="422" x2="94" y2="158" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f97316"/>
          <stop offset="0.6" stop-color="#ef4444"/>
          <stop offset="1" stop-color="#dc2626"/>
        </linearGradient>
        <radialGradient id="eyeGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(26)">
          <stop stop-color="#fbbf24"/>
          <stop offset="1" stop-color="#f59e0b"/>
        </radialGradient>
      </defs>
    </svg>
  </div>
</body>
</html>
